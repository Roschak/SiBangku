// Isolated Gradle build for the PTKOMIKCAFFE Android wrapper.
// The Android Gradle Plugin is resolved from the Google/Maven Central
// repositories declared here - nothing outside this folder is required.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SiBangku-PTKOMIKCAFFE"
include ':app'
