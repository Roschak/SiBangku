version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sibangku-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: sibangku
      POSTGRES_PASSWORD: sibangku_dev
      POSTGRES_DB: sibangku_control
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sibangku']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sibangku-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
