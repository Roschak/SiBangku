services:
  postgres:
    image: postgres:15-alpine
    container_name: sibangku-postgres-csharp
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sibangku
      POSTGRES_PASSWORD: sibangku_dev
      POSTGRES_DB: sibangku_control
    volumes:
      - pgdata-csharp:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sibangku -d sibangku_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-api:
    build:
      context: .
      dockerfile: src/SiBangku.ControlApi/Dockerfile
    container_name: sibangku-control-api-csharp
    ports:
      - "3001:8080"
    environment:
      - CONTROL_DATABASE_URL=Host=postgres;Port=5432;Database=sibangku_control;Username=sibangku;Password=sibangku_dev
      - JWT_SECRET=super_secret_jwt_key_platform_admin_2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tenant-api:
    build:
      context: .
      dockerfile: src/SiBangku.TenantApi/Dockerfile
    container_name: sibangku-tenant-api-csharp
    ports:
      - "3002:8080"
    environment:
      - CONTROL_DATABASE_URL=Host=postgres;Port=5432;Database=sibangku_control;Username=sibangku;Password=sibangku_dev
      - JWT_SECRET=super_secret_jwt_key_platform_admin_2026
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/SiBangku.Worker/Dockerfile
    container_name: sibangku-worker-csharp
    environment:
      - CONTROL_DATABASE_URL=Host=postgres;Port=5432;Database=sibangku_control;Username=sibangku;Password=sibangku_dev
      - WorkerCheckIntervalSeconds=60
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/SiBangku.Web/Dockerfile
    container_name: sibangku-web-csharp
    ports:
      - "3000:8080"
    environment:
      - CONTROL_API_URL=http://control-api:8080
      - TENANT_API_URL=http://tenant-api:8080
    depends_on:
      - control-api
      - tenant-api
    restart: unless-stopped

volumes:
  pgdata-csharp:
